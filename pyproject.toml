[tool.poetry]
name = "oncare"
version = "0.1.1"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pandas = "^2.2"
numpy = "^1.26"
scikit-learn = "^1.5"
openpyxl = "^3.1"
pyarrow = "^16.0"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
pydantic = "^2.8"
python-dotenv = "^1.0"
google-generativeai = "^0.8"
python-docx = "^1.1"
pytest = "^8.0"
langchain = "^0.3"
langchain-google-genai = "^2.0"
httpx = "^0.27"

[tool.pytest.ini_options]
pythonpath = ["."]
